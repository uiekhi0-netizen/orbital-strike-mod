name: Build Orbital Strike Mod (.jar)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Gradle Wrapper (If missing)
        run: |
          if [ ! -f "gradlew" ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.8
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Mod .jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-strike-1.0.0-mc1.21.1
          path: build/libs/*.jar
          
